name: Cypress regression (BDD)

on:
  push:
    branches: [master] # Only runs on merge; branch pushes are covered by the pull_request run
  pull_request:
  workflow_dispatch: # Lets you run it manually from the Actions tab

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      # 1. This repo (the Cypress framework)
      - name: Check out Cypress repo
        uses: actions/checkout@v4

      # 2. The test site, into a subfolder
      - name: Check out test site
        uses: actions/checkout@v4
        with:
          repository: samGreenwood2022/tradesource-site
          ref: master
          path: site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install deps, start the site, wait for it, run the Cucumber features
      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          start: npm start --prefix site
          wait-on: 'http://localhost:4321'
          spec: cypress/e2e/features/*.feature
          record: true # Sends results to Cypress Cloud (project id is in cypress.config.ts)
        env:
          # Cypress Cloud record key (read automatically by Cypress)
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          # Login credentials (read by cypress.config.ts and passed to cy.env())
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}

      # 4. Always upload the report, even when tests fail.
      # Failure screenshots are embedded inside the single HTML file.
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report
          path: cypress/reports/html/
          if-no-files-found: warn
          retention-days: 14

      # 5. The Cucumber report (HTML and JSON), also uploaded even when tests fail
      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: cypress/reports/cucumber/
          if-no-files-found: warn
          retention-days: 14

      # 6. Screenshots (a missing baseline image can be copied from here) and any visual diff images
      - name: Upload screenshots and visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: |
            cypress/screenshots/
            cypress/visual/diff/
          if-no-files-found: ignore
          retention-days: 14
