name: Cypress regression (BDD)

on:
  push:
    branches: [master] # Only runs on merge; branch pushes are covered by the pull_request run
  pull_request:
  workflow_dispatch: # Lets you run it manually from the Actions tab

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      # 1. This repo (the Cypress framework)
      - name: Check out Cypress repo
        uses: actions/checkout@v4

      # 2. The test site, into a subfolder. If the site repo has a branch with the same
      # name as this PR's branch, test against that, otherwise against master. This lets
      # a site change and its new baselines go through CI together
      - name: Pick test site branch
        id: site-ref
        run: |
          BRANCH="${{ github.head_ref }}"
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads https://github.com/samGreenwood2022/tradesource-site.git "$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
          echo "Using site branch: $(grep '^ref=' "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Check out test site
        uses: actions/checkout@v4
        with:
          repository: samGreenwood2022/tradesource-site
          ref: ${{ steps.site-ref.outputs.ref }}
          path: site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Start the site and wait until it answers. Uses 127.0.0.1 rather than
      # localhost: on newer runners localhost can resolve to IPv6 (::1) first, and
      # the old wait-on check failed with "Socket closed before the connection was
      # established". If the site doesn't start, its log is printed
      - name: Start site
        run: |
          nohup npm start --prefix site > site.log 2>&1 &
          if ! curl --silent --show-error --fail --retry 30 --retry-delay 1 --retry-all-errors --output /dev/null http://127.0.0.1:4321; then
            echo "The site did not start. Its log:"
            cat site.log
            exit 1
          fi
          echo "Site is up"

      # 4. Install deps and run the Cucumber features against the running site
      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          spec: cypress/e2e/features/*.feature
          browser: chrome # Chrome is preinstalled on GitHub ubuntu runners; default would be Electron
          record: true # Sends results to Cypress Cloud (project id is in cypress.config.ts)
        env:
          # Overrides baseUrl (localhost) in cypress.config.ts, for the same IPv6 reason as above
          CYPRESS_BASE_URL: http://127.0.0.1:4321
          # Cypress Cloud record key (read automatically by Cypress)
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          # Login credentials (read by cypress.config.ts and passed to cy.env())
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}

      # 5. Always upload the report, even when tests fail.
      # Failure screenshots are embedded inside the single HTML file.
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report
          path: cypress/reports/html/
          if-no-files-found: warn
          retention-days: 14

      # 6. The Cucumber report (HTML and JSON), also uploaded even when tests fail
      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: cypress/reports/cucumber/
          if-no-files-found: warn
          retention-days: 14

      # 7. Screenshots (a missing baseline image can be copied from here) and any visual diff images
      - name: Upload screenshots and visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: |
            cypress/screenshots/
            cypress/visual/diff/
          if-no-files-found: ignore
          retention-days: 14
